
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-gray-900 p-4">
    <div class="container mx-auto flex justify-between items-center">
      <a href="index.html" class="text-white text-xl font-bold">MinhaLogo</a>
      <button id="menu-btn" class="block md:hidden text-white focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <div class="hidden md:flex space-x-6">
        <a href="index.html" class="text-white hover:text-orange-400">Início</a>
        <a href="sobre.html" class="text-white hover:text-orange-400">Sobre</a>
        <a href="servicos.html" class="text-white hover:text-orange-400">Serviços</a>
        <a href="contato.html" class="text-orange-400">Contato</a>
      </div>
    </div>
    <div id="menu" class="hidden md:hidden mt-4 space-y-4">
      <a href="index.html" class="block text-white hover:text-orange-400">Início</a>
      <a href="sobre.html" class="block text-white hover:text-orange-400">Sobre</a>
      <a href="servicos.html" class="block text-white hover:text-orange-400">Serviços</a>
      <a href="contato.html" class="block text-orange-400">Contato</a>
    </div>
  </nav>

  <!-- Conteúdo -->
  <section class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-4">Fale Conosco</h1>
    <form class="space-y-4 max-w-md">
      <input type="text" placeholder="Seu nome" class="w-full p-2 border rounded">
      <input type="email" placeholder="Seu e-mail" class="w-full p-2 border rounded">
      <textarea placeholder="Sua mensagem" rows="4" class="w-full p-2 border rounded"></textarea>
      <button type="submit" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">Enviar</button>
    </form>
  </section>

  <!-- Script -->
  <script>
    const btn = document.getElementById("menu-btn");
    const menu = document.getElementById("menu");
    btn.addEventListener("click", () => menu.classList.toggle("hidden"));
  </script>
</body>
  </html>
